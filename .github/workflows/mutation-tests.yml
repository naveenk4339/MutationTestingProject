name: Mutation Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  pitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit tests + mutation tests
        run: mvn -B test org.pitest:pitest-maven:mutationCoverage
      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports/
